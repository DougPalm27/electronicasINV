<svg viewBox="0 0 400 430" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Esquema en corte lateral de la clasificadora Evo">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#eef0ec" stroke-width="1"/>
    </pattern>
    <style>
      .lbl { font-family: ui-monospace, Consolas, monospace; font-size: 7.5px;
             letter-spacing: .08em; fill: #8a919c; text-transform: uppercase; }
    </style>
  </defs>
  <rect x="0" y="0" width="400" height="430" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="430" fill="url(#grid)"/>

  <!-- gabinete -->
  <rect x="30" y="22" width="340" height="380" fill="none" stroke="#1d2a24" stroke-width="1.6"/>
  <line x1="30" y1="366" x2="370" y2="366" stroke="#b9c2ba" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- tolva -->
  <polygon points="150,36 250,36 224,86 176,86" fill="none" stroke="#57606a" stroke-width="1.3"/>
  <rect x="176" y="90" width="48" height="10" fill="none" stroke="#57606a" stroke-width="1.1"/>
  <text class="lbl" x="258" y="52">Tolva</text>

  <!-- rampa -->
  <polygon points="196,104 210,104 162,268 148,268" fill="#f7f8f6" stroke="#57606a" stroke-width="1.3"/>
  <text class="lbl" x="216" y="170">Rampa</text>

  <!-- tarjeta controladora -->
  <rect x="296" y="120" width="46" height="66" fill="#ffffff" stroke="#1d2a24" stroke-width="1.4"/>
  <line x1="304" y1="132" x2="334" y2="132" stroke="#8a919c" stroke-width="1"/>
  <line x1="304" y1="144" x2="334" y2="144" stroke="#8a919c" stroke-width="1"/>
  <line x1="304" y1="156" x2="326" y2="156" stroke="#8a919c" stroke-width="1"/>
  <circle cx="330" cy="172" r="3.5" fill="none" stroke="#8a919c" stroke-width="1"/>

  <!-- cámaras -->
  <rect x="62" y="252" width="44" height="30" fill="#ffffff" stroke="#1d2a24" stroke-width="1.4"/>
  <circle cx="100" cy="267" r="4" fill="none" stroke="#1d2a24" stroke-width="1.2"/>
  <rect x="216" y="252" width="44" height="30" fill="#ffffff" stroke="#1d2a24" stroke-width="1.4"/>
  <circle cx="222" cy="267" r="4" fill="none" stroke="#1d2a24" stroke-width="1.2"/>
  <line x1="106" y1="267" x2="152" y2="278" stroke="#8a919c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="216" y1="267" x2="164" y2="278" stroke="#8a919c" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- lámparas -->
  <rect x="66" y="234" width="36" height="8" fill="#ffffff" stroke="#1d2a24" stroke-width="1.2"/>
  <rect x="220" y="234" width="36" height="8" fill="#ffffff" stroke="#1d2a24" stroke-width="1.2"/>
  <line x1="84" y1="246" x2="84" y2="252" stroke="#8a919c" stroke-width="1"/>
  <line x1="238" y1="246" x2="238" y2="252" stroke="#8a919c" stroke-width="1"/>

  <!-- barra de eyectores -->
  <rect x="104" y="298" width="116" height="16" fill="#ffffff" stroke="#1d2a24" stroke-width="1.5"/>
  <g fill="#57606a">
    <circle cx="112" cy="306" r="1.7"/><circle cx="122" cy="306" r="1.7"/><circle cx="132" cy="306" r="1.7"/>
    <circle cx="142" cy="306" r="1.7"/><circle cx="152" cy="306" r="1.7"/><circle cx="162" cy="306" r="1.7"/>
    <circle cx="172" cy="306" r="1.7"/><circle cx="182" cy="306" r="1.7"/><circle cx="192" cy="306" r="1.7"/>
    <circle cx="202" cy="306" r="1.7"/><circle cx="212" cy="306" r="1.7"/>
  </g>
  <line x1="150" y1="298" x2="140" y2="286" stroke="#8a919c" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- caída aceptado / rechazo -->
  <line x1="150" y1="286" x2="128" y2="358" stroke="#57606a" stroke-width="1.1"/>
  <line x1="158" y1="290" x2="196" y2="358" stroke="#57606a" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text class="lbl" x="96" y="382">Aceptado</text>
  <text class="lbl" x="186" y="382">Rechazo</text>

  <text class="lbl" x="30" y="420">Esquema referencial · no a escala</text>
</svg>
